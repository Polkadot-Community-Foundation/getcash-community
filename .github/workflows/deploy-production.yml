name: Deploy (production)

# PCF production: a dispatch on `production` builds and publishes getcash behind the `production`
# environment approval, then tags the deployed commit `production/<YYYY-MM-DD>.<n>`. A dispatch on
# a `production/*` tag redeploys that tag (rollback). Any other ref is refused.
# The target name and network come from the environment variables DEPLOY_DOMAIN and DEPLOY_ENV.

on:
  workflow_dispatch:

permissions:
  contents: read

# Deploys write on-chain records. They queue and are never cancelled mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ref:
    name: Require a production ref
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "$GITHUB_REF" in
            refs/heads/production | refs/tags/production/*) ;;
            *)
              echo "::error::production deploys run only when dispatched on the production branch or a production/* tag"
              exit 1
              ;;
          esac

  deploy:
    needs: ref
    name: getcash (production)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check required variables
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
        run: |
          missing=""
          [ -n "$DEPLOY_DOMAIN" ] || missing="$missing DEPLOY_DOMAIN"
          [ -n "$DEPLOY_ENV" ] || missing="$missing DEPLOY_ENV"
          if [ -n "$missing" ]; then
            echo "::error::Set these variables on the production environment:$missing"
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Refuse a test network build
        run: |
          if ! jq -e '.testnet == false' packages/core/src/network.json > /dev/null; then
            echo "::error::packages/core/src/network.json describes a test network; a production deploy needs the production chain facts"
            exit 1
          fi

      # Build and deploy share one job, so nothing is built before the environment approval.
      - uses: ./.github/actions/build-site
        with:
          chainflip-broker-api-key: ${{ secrets.VITE_CHAINFLIP_BROKER_API_KEY }}
          meld-base-url: ${{ secrets.VITE_MELD_BASE_URL }}
          meld-product-id: ${{ secrets.VITE_MELD_PRODUCT_ID }}
          offramp-lanes: ${{ vars.VITE_OFFRAMP_LANES }}

      # The manifest and worker record come from bulletin-deploy.config.ts in the checkout.
      - uses: ./.github/actions/deploy-site
        with:
          domain: ${{ vars.DEPLOY_DOMAIN }}
          env: ${{ vars.DEPLOY_ENV }}
          mnemonic: ${{ secrets.MNEMONIC }}

  tag:
    needs: deploy
    if: github.ref == 'refs/heads/production'
    name: Tag the deployed commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Tag the deployed commit
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/production/${DATE}.*" \
            | sed -n "s#.*refs/tags/production/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          TAG="production/${DATE}.$(( ${LAST:-0} + 1 ))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "getcash production deploy, run ${GITHUB_RUN_ID}"
          git push origin "refs/tags/$TAG"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"
